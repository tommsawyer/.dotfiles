      - "#7E9CD8"
      - "bold"
    inactiveBorderColor:
      - "#54546D"
    searchingActiveBorderColor:
      - "#FF9E3B"
      - "bold"
    optionsTextColor:
      - "#7E9CD8"
    selectedLineBgColor:
      - "#2D4F67"
    cherryPickedCommitFgColor:
      - "#16161D"
