gui:
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  sidePanelWidth: 0.4
  border: rounded
  showNumstatInFilesView: true
  showDivergenceFromBaseBranch: arrowAndNumber
  showRandomTip: false
  # dark unless LG_CONFIG_FILE adds light.yml (`theme light`, ~/.config/theme/env.sh); also what
  # {{colorScheme}} passes to delta below
  colorScheme: dark
  darkTheme:
    activeBorderColor:
      - "#57A5E5"
      - "bold"
    inactiveBorderColor:
      - "#5A5B5E"
    searchingActiveBorderColor:
      - "#C49060"
      - "bold"
    optionsTextColor:
      - "#57A5E5"
    selectedLineBgColor:
      - "#37383D"
    cherryPickedCommitFgColor:
      - "#1B1C1E"
    cherryPickedCommitBgColor:
      - "#BB70D2"
    markedBaseCommitFgColor:
      - "#1B1C1E"
    markedBaseCommitBgColor:
      - "#DBB671"
    # the palette red (env.sh), not warmer's #de5d68 that nvim still uses
    unstagedChangesColor:
      - "#E16D77"
    defaultFgColor:
      - "#A7AAB0"
  # the same roles in onedark light; text on marked commits in its background, not bg_d
  lightTheme:
    activeBorderColor:
      - "#4078F2"
      - "bold"
    inactiveBorderColor:
      - "#A0A1A7"
    searchingActiveBorderColor:
      - "#C18401"
      - "bold"
    optionsTextColor:
      - "#4078F2"
    selectedLineBgColor:
      - "#DCDCDC"
    cherryPickedCommitFgColor:
      - "#FAFAFA"
    cherryPickedCommitBgColor:
      - "#A626A4"
    markedBaseCommitFgColor:
      - "#FAFAFA"
    markedBaseCommitBgColor:
      - "#986801"
    unstagedChangesColor:
      - "#E45649"
    defaultFgColor:
      - "#383A42"

git:
  diffRenderers:
    - type: stdinFilter
      # side by side only when the diff view is wide enough (+ maximizes it)
      command: delta --{{colorScheme}} --paging=never --width={{width}} {{if ge .width 140}}--side-by-side{{end}}

os:
  editPreset: nvim # e opens the file in nvim inside the popup

# worktrees with a tmux session of their own (~/.config/tmux/worktree.sh): the keys of the Worktrees
# tab (panel 2, ]) take over the built-in ones, which know nothing about tmux; space still switches
# lazygit itself to the worktree
customCommands:
  # spelled out twice: lazygit does not load a config with yaml aliases
  - key: <ctrl+n>
    context: global
    description: New worktree with a tmux session
    prompts:
      - type: input
        title: Branch, new or existing
        key: Branch
    command: ~/.config/tmux/worktree.sh new {{.Form.Branch | quote}}
    output: log
  - key: "n"
    context: worktrees
    description: New worktree with a tmux session
    prompts:
      - type: input
        title: Branch, new or existing
        key: Branch
    command: ~/.config/tmux/worktree.sh new {{.Form.Branch | quote}}
    output: log
  - key: <enter>
    context: worktrees
    description: Open the tmux session of the worktree
    command: ~/.config/tmux/worktree.sh open {{.SelectedWorktree.Path | quote}}
    output: log
  - key: d
    context: worktrees
    description: Remove the worktree, its tmux session and its branch if merged
    prompts:
      - type: confirm
        title: Remove worktree
        body: "Remove {{.SelectedWorktree.Path}} and its tmux session? Whatever runs in the session is killed."
    command: ~/.config/tmux/worktree.sh rm {{.SelectedWorktree.Path | quote}}
    output: log
