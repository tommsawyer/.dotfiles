gui:
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  border: single
  theme:
    activeBorderColor:
      - "#7DAEA3"
      - "bold"
    inactiveBorderColor:
      - "#504945"
    searchingActiveBorderColor:
      - "#E78A4E"
      - "bold"
    optionsTextColor:
      - "#7DAEA3"
    selectedLineBgColor:
      - "#3C3836"
    cherryPickedCommitFgColor:
      - "#141617"
    cherryPickedCommitBgColor:
      - "#D3869B"
    markedBaseCommitFgColor:
      - "#141617"
    markedBaseCommitBgColor:
      - "#D8A657"
    unstagedChangesColor:
      - "#EA6962"
    defaultFgColor:
      - "#D4BE98"

git:
  diffRenderers:
    - type: stdinFilter
      # side by side only when the diff view is wide enough (+ maximizes it)
      command: delta --{{colorScheme}} --paging=never --width={{width}} {{if ge .width 140}}--side-by-side{{end}}

os:
  editPreset: nvim # e opens the file in nvim inside the popup
