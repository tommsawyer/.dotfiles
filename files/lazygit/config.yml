gui:
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  border: single
  theme:
    activeBorderColor:
      - "#57A5E5"
      - "bold"
    inactiveBorderColor:
      - "#5A5B5E"
    searchingActiveBorderColor:
      - "#C49060"
      - "bold"
    optionsTextColor:
      - "#57A5E5"
    selectedLineBgColor:
      - "#37383D"
    cherryPickedCommitFgColor:
      - "#1B1C1E"
    cherryPickedCommitBgColor:
      - "#BB70D2"
    markedBaseCommitFgColor:
      - "#1B1C1E"
    markedBaseCommitBgColor:
      - "#DBB671"
    unstagedChangesColor:
      - "#DE5D68"
    defaultFgColor:
      - "#A7AAB0"

git:
  diffRenderers:
    - type: stdinFilter
      # side by side only when the diff view is wide enough (+ maximizes it)
      command: delta --{{colorScheme}} --paging=never --width={{width}} {{if ge .width 140}}--side-by-side{{end}}

os:
  editPreset: nvim # e opens the file in nvim inside the popup
