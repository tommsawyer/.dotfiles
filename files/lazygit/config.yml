gui:
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  border: single
  # dark unless LG_CONFIG_FILE adds light.yml (`theme light`, ~/.config/theme/env.sh); also what
  # {{colorScheme}} passes to delta below
  colorScheme: dark
  darkTheme:
    activeBorderColor:
      - "#57A5E5"
      - "bold"
    inactiveBorderColor:
      - "#5A5B5E"
    searchingActiveBorderColor:
      - "#C49060"
      - "bold"
    optionsTextColor:
      - "#57A5E5"
    selectedLineBgColor:
      - "#37383D"
    cherryPickedCommitFgColor:
      - "#1B1C1E"
    cherryPickedCommitBgColor:
      - "#BB70D2"
    markedBaseCommitFgColor:
      - "#1B1C1E"
    markedBaseCommitBgColor:
      - "#DBB671"
    unstagedChangesColor:
      - "#DE5D68"
    defaultFgColor:
      - "#A7AAB0"
  # the same roles in onedark light; text on marked commits in its background, not bg_d
  lightTheme:
    activeBorderColor:
      - "#4078F2"
      - "bold"
    inactiveBorderColor:
      - "#A0A1A7"
    searchingActiveBorderColor:
      - "#C18401"
      - "bold"
    optionsTextColor:
      - "#4078F2"
    selectedLineBgColor:
      - "#DCDCDC"
    cherryPickedCommitFgColor:
      - "#FAFAFA"
    cherryPickedCommitBgColor:
      - "#A626A4"
    markedBaseCommitFgColor:
      - "#FAFAFA"
    markedBaseCommitBgColor:
      - "#986801"
    unstagedChangesColor:
      - "#E45649"
    defaultFgColor:
      - "#383A42"

git:
  diffRenderers:
    - type: stdinFilter
      # side by side only when the diff view is wide enough (+ maximizes it)
      command: delta --{{colorScheme}} --paging=never --width={{width}} {{if ge .width 140}}--side-by-side{{end}}

os:
  editPreset: nvim # e opens the file in nvim inside the popup
