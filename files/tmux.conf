set-option -g prefix C-f
set -sg escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1

set-option -g set-titles on
set-option -g set-titles-string "#T - #W"
set-option -g allow-rename off

# reload config
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J join-pane
bind b break-pane
bind ! select-layout main-horizontal
bind @ select-layout even-horizontal

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

setw -g mouse on

# lazygit in a floating modal pane (tmux 3.7+), closes when lazygit exits
bind G new-pane -O -K -B single -x 90% -y 90% -X 5% -Y 5% -c "#{pane_current_path}" lazygit

# scrollbars appear while scrolling and auto-hide
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-position right

# TokyoNight (night) palette
# #16161e - bg dark      #1a1b26 - bg          #3b4261 - fg gutter
# #c0caf5 - fg           #a9b1d6 - fg dark     #565f89 - comment
# #7aa2f7 - blue         #7dcfff - cyan        #bb9af7 - magenta
# #9ece6a - green        #e0af68 - yellow      #ff9e64 - orange

set-option -g status-position top
set-option -g status-style "fg=#7aa2f7,bg=#16161e"
set-option -g status-left-length 80
set-option -g status-right-length 150
set-option -g main-pane-height 38
setw -g window-status-separator ""
setw -g window-status-current-style default

# session name turns yellow while prefix is pressed
set-option -g status-left "#{?client_prefix,#[fg=#16161e#,bg=#e0af68#,bold],#[fg=#16161e#,bg=#7aa2f7#,bold]} #S #[default] "
set-option -g status-right "#[fg=#565f89,bg=#16161e] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) #[fg=#7aa2f7,bg=#3b4261] %H:%M #[fg=#16161e,bg=#7aa2f7,bold] #h "

setw -g window-status-format "#[fg=#a9b1d6,bg=#16161e] #I | #W "
setw -g window-status-current-format "#[fg=#7aa2f7,bg=#3b4261,bold] #I | #W "

set-option -g pane-border-style "fg=#3b4261"
set-option -g pane-active-border-style "fg=#7aa2f7"
set-option -g mode-style "fg=#7aa2f7,bg=#3b4261"
set-option -g message-style "fg=#7aa2f7,bg=#3b4261"
set-option -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set-option -g pane-scrollbars-style "fg=#565f89,bg=#1a1b26,width=1,pad=0"
