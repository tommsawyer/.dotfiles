# kitty: one window, no tabs or splits (tmux has them), onedark warmer or light by `theme`.
# ~/.config/kitty links here (make symlinks).

font_family      family="FiraCode Nerd Font Mono"
font_size        15.0

# the current theme at start; `theme` switches open windows through the socket below
geninclude theme.py
allow_remote_control socket-only
# $TMPDIR/kitty-<pid>
listen_on unix:kitty

# no title bar, tab bar or extra windows: a single terminal with tmux inside
hide_window_decorations titlebar-only
tab_bar_style hidden
enabled_layouts stack
window_padding_width 4 8
placement_strategy top-left
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0
# the prompt and the title come from zshrc, the cursor stays a block as in iTerm
shell_integration no-cursor no-title

# only the shortcuts of a plain terminal; fallback: cmd+c and the rest work in the Russian layout too
clear_all_shortcuts yes
map --allow-fallback=shifted,ascii cmd+c copy_or_noop
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard
map --allow-fallback=shifted,ascii cmd+n new_os_window
map --allow-fallback=shifted,ascii cmd+w close_os_window
map --allow-fallback=shifted,ascii cmd+q quit
map --allow-fallback=shifted,ascii cmd+h hide_macos_app
map --allow-fallback=shifted,ascii cmd+m minimize_macos_window
map --allow-fallback=shifted,ascii cmd+k clear_terminal to_cursor active
map --allow-fallback=shifted,ascii ctrl+cmd+f toggle_fullscreen
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
map cmd+`     macos_cycle_through_os_windows
# tmux learns Shift+Enter, Ctrl+Enter (claude code) and Ctrl+. (sidekick in nvim) from these
# csi-u codes: kitty has no modifyOtherKeys, which tmux turns on for iTerm
map shift+enter  send_text all \x1b[13;2u
map ctrl+enter   send_text all \x1b[13;5u
map ctrl+period  send_text all \x1b[46;5u
