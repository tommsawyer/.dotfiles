# onedark warmer and onedark light for bookokrat, as base16 (the palette of theme/env.sh).
# bookokrat keeps its settings in ~/.config/bookokrat/config.yaml and writes to it itself, so the
# file is not linked: `make bookokrat` puts this section into it in place of its custom_themes,
# `theme light|dark` sets its theme: to one of these
custom_themes:
  - scheme: "OneDark Warmer"
    base00: "232326"
    base01: "2C2D31"
    base02: "37383D"
    base03: "5A5B5E"
