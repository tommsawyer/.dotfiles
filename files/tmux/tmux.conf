set-option -g prefix C-f
set -sg escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
# pass Shift+Enter, Ctrl+Enter, C-i vs Tab etc. to apps that ask for them (claude code, nvim);
# iTerm already reports the extkeys feature to tmux
set -s extended-keys on
set -s extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1
# closing window 2 of 1 2 3 leaves 1 2, not 1 3
set -g renumber-windows on

set-option -g set-titles on
set-option -g set-titles-string "#T - #W"
set-option -g allow-rename off

# reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J join-pane
bind b break-pane
bind ! select-layout main-horizontal
bind @ select-layout even-horizontal

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mouse on

# lazygit in a floating modal pane (tmux 3.7+), closes when lazygit exits
bind G new-pane -O -K -B single -x 90% -y 90% -X 5% -Y 5% -c "#{pane_current_path}" lazygit
# k9s the same way (read-only by its config)
bind K new-pane -O -K -B single -x 90% -y 90% -X 5% -Y 5% k9s
# windows of all sessions in fzf with a live preview (switch.sh next to this file); choose-tree stays on prefix w
bind s display-popup -E -b single -w 85% -h 75% -T " windows " ~/.config/tmux/switch.sh

# scrollbars appear while scrolling and auto-hide
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-position right

# Kanagawa (wave) palette
# #16161D - sumiInk0     #1F1F28 - bg          #2A2A37 - sumiInk4    #54546D - sumiInk6
# #DCD7BA - fg           #C8C093 - oldWhite    #727169 - fujiGray
# #7E9CD8 - crystalBlue  #223249 - waveBlue1   #2D4F67 - waveBlue2
# #7AA89F - waveAqua2   #98BB6C - springGreen  #E6C384 - carpYellow  #957FB8 - oniViolet  #FF9E3B - roninYellow

set-option -g status-position top
set-option -g status-style "fg=#7E9CD8,bg=#16161D"
set-option -g status-left-length 80
set-option -g status-right-length 150
set-option -g main-pane-height 38
setw -g window-status-separator ""
setw -g window-status-current-style default

# session name turns yellow while prefix is pressed
set-option -g status-left "#{?client_prefix,#[fg=#16161D#,bg=#E6C384#,bold],#[fg=#16161D#,bg=#7AA89F#,bold]} 󰆍 #S #[default] "
set-option -g status-right "#[fg=#727169,bg=#16161D] #(cd #{pane_current_path}; b=$(git rev-parse --abbrev-ref HEAD 2>/dev/null) && echo  \$b) #[fg=#957FB8]#(f=\${KUBECONFIG:-\$HOME/.kube/config}; awk '/^current-context:/ { gsub(/\"/, \"\", \$2); if (\$2 != \"\") print \"󱃾 \" \$2; exit }' \$(echo \$f | cut -d: -f1) 2>/dev/null) #[fg=#7E9CD8,bg=#2A2A37] %H:%M "

# what agents (claude, opencode...) write to their pane title, from any pane of the window, so the
# tab says what each agent is busy with: "2 | review-dotfiles-refactor - 2.1.301". Skipped: empty
# titles, the default one (host name), shells (an exited agent leaves its title behind) and the
# status glyph in front ("✳ ", "⠐ "); 30 chars at most
set -g @agent_title "#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host}},#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}}}},,#{s/^[^A-Za-z0-9А-Яа-яЁё]+ //:pane_title}}}"
set -g @window_label "#{?#{E:@agent_title},#{=30:#{E:@agent_title}} - ,}#W"
# picks up title changes sooner (the default is 15s)
set -g status-interval 5

setw -g window-status-format "#[fg=#C8C093,bg=#16161D] #I | #{E:@window_label} "
setw -g window-status-current-format "#[fg=#7E9CD8,bg=#2A2A37,bold] #I | #{E:@window_label} "

set-option -g pane-border-style "fg=#54546D"
set-option -g pane-active-border-style "fg=#7E9CD8"
# selection in choose-tree (C-f s / w) and copy mode
set-option -g mode-style "fg=#16161D,bg=#7AA89F,bold"
set-option -g message-style "fg=#7E9CD8,bg=#2A2A37"
set-option -g message-command-style "fg=#7E9CD8,bg=#2A2A37"
set-option -g pane-scrollbars-style "fg=#54546D,bg=#1F1F28,width=1,pad=0"
