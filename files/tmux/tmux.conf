set-option -g prefix C-f
set -sg escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
# pass Shift+Enter, Ctrl+Enter, C-i vs Tab etc. to apps that ask for them (claude code, nvim);
# iTerm already reports the extkeys feature to tmux
set -s extended-keys on
set -s extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1
# closing window 2 of 1 2 3 leaves 1 2, not 1 3
set -g renumber-windows on

set-option -g set-titles on
set-option -g set-titles-string "#T - #W"
set-option -g allow-rename off

# reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J join-pane
bind b break-pane
bind ! select-layout main-horizontal
bind @ select-layout even-horizontal

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mouse on

# lazygit in a floating modal pane (tmux 3.7+), closes when lazygit exits;
# replaces the default prefix g (move-floating-panes key table)
bind g new-pane -O -K -B single -x 90% -y 90% -X 5% -Y 5% -c "#{pane_current_path}" lazygit
# k9s the same way (read-only by its config)
bind K new-pane -O -K -B single -x 90% -y 90% -X 5% -Y 5% k9s
# sessions in fzf with a live preview (switch.sh next to this file); choose-tree stays on prefix w
bind s display-popup -E -b single -w 85% -h 75% -T " sessions " ~/.config/tmux/switch.sh
# claude code panes of all sessions in fzf, the ones waiting for you first (agents.sh)
bind a display-popup -E -b single -w 85% -h 75% -T " agents " ~/.config/tmux/agents.sh

# scrollbars appear while scrolling and auto-hide
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-position right

# OneDark (warmer) palette
# #1B1C1E - bg_d    #232326 - bg0     #2C2D31 - bg1     #5A5B5E - grey
# #A7AAB0 - fg      #818387 - light_grey
# #57A5E5 - blue    #51A8B3 - cyan    #DBB671 - yellow  #BB70D2 - purple

set-option -g status-position top
set-option -g status-style "fg=#57A5E5,bg=#1B1C1E"
set-option -g status-left-length 80
set-option -g status-right-length 150
set-option -g main-pane-height 38
setw -g window-status-separator ""
setw -g window-status-current-style default

# session name turns yellow while prefix is pressed
set-option -g status-left "#{?client_prefix,#[fg=#1B1C1E#,bg=#DBB671#,bold],#[fg=#1B1C1E#,bg=#51A8B3#,bold]} 󰆍 #S #[default] "
# error / warning counts of nvim in any pane of the current window, next to the git branch
# (lua/autocommands.lua sets these pane options, unset when zero): also seen from an agent pane beside nvim
set -g @nvim_diag "#{P:#{?#{@nvim_errors}, #[fg=#E16D77]\uf057 #{@nvim_errors},}#{?#{@nvim_warns}, #[fg=#DBB671]\uf071 #{@nvim_warns},}}"
set-option -g status-right "#[fg=#818387,bg=#1B1C1E] #(~/.config/tmux/git.sh '#{pane_current_path}')#{E:@nvim_diag} #[fg=#BB70D2]#(f=\${KUBECONFIG:-\$HOME/.kube/config}; awk '/^current-context:/ { gsub(/\"/, \"\", \$2); if (\$2 != \"\") print \"󱃾 \" \$2; exit }' \$(echo \$f | cut -d: -f1) 2>/dev/null) #[fg=#5A5B5E]│ #[fg=#57A5E5]%H:%M "

# what agents (claude, opencode...) write to their pane title, from any pane of the window, so the
# tab says what each agent is busy with: "2 | review-dotfiles-refactor - 2.1.301". Skipped: empty
# titles, the default one (host name), shells (an exited agent leaves its title behind), a title that
# is just the command (zshrc sets "nvim" while nvim runs: no "nvim - nvim") and the status
# glyph in front ("✳ ", "⠐ "); 30 chars at most
set -g @agent_title "#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host}},#{||:#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}},#{==:#{pane_title},#{pane_current_command}}}}},,#{s/^[^A-Za-z0-9А-Яа-яЁё]+ //:pane_title}}}"
set -g @window_label "#{?#{E:@agent_title},#{=30:#{E:@agent_title}} - ,}#W"
# picks up title changes sooner (the default is 15s)
set -g status-interval 5

# yellow ▲ after the label while claude in any pane of the window waits for you (agents.sh sets
# @agent_state from its hooks); last, so the colour change does not leak into the label
set -g @agent_wait "#{?#{P:#{?#{==:#{@agent_state},wait},1,}},#[fg=#DBB671] ▲,}"

setw -g window-status-format "#[fg=#818387,bg=#1B1C1E] #I | #{E:@window_label}#{E:@agent_wait} "
setw -g window-status-current-format "#[fg=#57A5E5,bg=#2C2D31,bold] #I | #{E:@window_label}#{E:@agent_wait} "

set-option -g pane-border-style "fg=#5A5B5E"
set-option -g pane-active-border-style "fg=#57A5E5"
# popups (prefix s) framed like the floating lazygit / k9s panes, which take the active pane border
set-option -g popup-style "fg=#A7AAB0,bg=#232326"
set-option -g popup-border-style "fg=#57A5E5,bg=#232326"
# selection in choose-tree (C-f s / w) and copy mode
set-option -g mode-style "fg=#1B1C1E,bg=#51A8B3,bold"
# fill: since tmux 3.8 the prompt and messages are drawn over the status line, fill clears it
set-option -g message-style "fg=#57A5E5,bg=#2C2D31,fill=#2C2D31"
set-option -g message-command-style "fg=#57A5E5,bg=#2C2D31,fill=#2C2D31"
set-option -g pane-scrollbars-style "fg=#5A5B5E,bg=#232326,width=1,pad=0"
