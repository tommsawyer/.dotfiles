set-option -g prefix C-f
set -sg escape-time 0
setw -g aggressive-resize on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g focus-events on
# pass Shift+Enter, Ctrl+Enter, C-i vs Tab etc. to apps that ask for them (claude code, nvim);
# iTerm already reports the extkeys feature to tmux
set -s extended-keys on
set -s extended-keys-format csi-u

set -g base-index 1
setw -g pane-base-index 1
# closing window 2 of 1 2 3 leaves 1 2, not 1 3
set -g renumber-windows on

set-option -g set-titles on
set-option -g set-titles-string "#T - #W"
set-option -g allow-rename off

# reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J join-pane
bind b break-pane
bind ! select-layout main-horizontal
bind @ select-layout even-horizontal

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mouse on

# lazygit in a popup over the window dimmed (popup.sh), closes when lazygit exits;
# replaces the default prefix g (move-floating-panes key table)
bind g run -b "~/.config/tmux/popup.sh '#{window_id}' '#{client_name}' -E -b single -w 90% -h 90% -d '#{pane_current_path}' -T ' lazygit ' lazygit"
# k9s the same way (read-only by its config)
bind K run -b "~/.config/tmux/popup.sh '#{window_id}' '#{client_name}' -E -b single -w 90% -h 90% -T ' k9s ' k9s"
# sessions in fzf with a live preview (switch.sh next to this file), over the window dimmed
# (popup.sh); choose-tree stays on prefix w
bind s run -b "~/.config/tmux/popup.sh '#{window_id}' '#{client_name}' -e 'CURRENT_SESSION=#{session_name}' -E -b single -w 85% -h 75% -T ' sessions ' ~/.config/tmux/switch.sh"
# claude code panes of all sessions in fzf, the ones waiting for you first (agents.sh)
bind a run -b "~/.config/tmux/popup.sh '#{window_id}' '#{client_name}' -E -b single -w 85% -h 75% -T ' agents ' ~/.config/tmux/agents.sh"

# scrollbars appear while scrolling and auto-hide
set -g pane-scrollbars auto-hide
set -g pane-scrollbars-position right

# colours from theme-dark.conf or theme-light.conf, as `theme` (~/.config/theme) left it;
# the style options take them with -F, so `theme` sources this file again after a switch
if-shell '[ "$(cat "${XDG_STATE_HOME:-$HOME/.local/state}/theme" 2>/dev/null)" = light ]' \
  'set -g @theme light' 'set -g @theme dark'
source-file -F "#{d:current_file}/theme-#{@theme}.conf"

set-option -g status-position top
set-option -gF status-style "fg=#{@thm_blue},bg=#{@thm_bar}"
set-option -g status-left-length 80
set-option -g status-right-length 150
set-option -g main-pane-height 38
setw -g window-status-separator ""
setw -g window-status-current-style default

# session name turns yellow while prefix is pressed
set-option -g status-left "#{?client_prefix,#[fg=#{@thm_on_accent}#,bg=#{@thm_yellow}#,bold],#[fg=#{@thm_on_accent}#,bg=#{@thm_cyan}#,bold]} 󰆍 #S #[default] "
# error / warning counts of nvim in any pane of the current window, next to the git branch
# (lua/autocommands.lua sets these pane options, unset when zero): also seen from an agent pane beside nvim
set -g @nvim_diag "#{P:#{?#{@nvim_errors}, #[fg=#{@thm_red}]\uf057 #{@nvim_errors},}#{?#{@nvim_warns}, #[fg=#{@thm_yellow}]\uf071 #{@nvim_warns},}}"
set-option -g status-right "#[fg=#{@thm_muted},bg=#{@thm_bar}] #(~/.config/tmux/git.sh '#{pane_current_path}' '#{@thm_green}' '#{@thm_red}')#{E:@nvim_diag} #[fg=#{@thm_purple}]#(f=\${KUBECONFIG:-\$HOME/.kube/config}; awk '/^current-context:/ { gsub(/\"/, \"\", \$2); if (\$2 != \"\") print \"󱃾 \" \$2; exit }' \$(echo \$f | cut -d: -f1) 2>/dev/null) #[fg=#{@thm_faint}]│ #[fg=#{@thm_blue}]%H:%M "

# what agents (claude, opencode...) write to their pane title, from any pane of the window, so the
# tab says what each agent is busy with: "2 | review-dotfiles-refactor - 2.1.301". Skipped: empty
# titles, the default one (host name), shells (an exited agent leaves its title behind), a title that
# is just the command (zshrc sets "nvim" while nvim runs: no "nvim - nvim") and the status
# glyph in front ("✳ ", "⠐ "); 30 chars at most
set -g @agent_title "#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host}},#{||:#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}},#{==:#{pane_title},#{pane_current_command}}}}},,#{s/^[^A-Za-z0-9А-Яа-яЁё]+ //:pane_title}}}"
set -g @window_label "#{?#{E:@agent_title},#{=30:#{E:@agent_title}} - ,}#W"
# picks up title changes sooner (the default is 15s)
set -g status-interval 5

# claude's state in front of the label, the same icons as in the agent picker (prefix a): yellow ▲ while
# claude in any pane of the window waits for you, then 󰔟 working, then ✔ done (agents.sh sets
# @agent_state from its hooks); skipped in a shell pane: claude was killed and left its state behind;
# the tab formats set their colour again after it
set -g @agent_live "#{!:#{m/r:^-?(zsh|bash|sh)$,#{pane_current_command}}}"
set -g @agent_icon "#{?#{P:#{?#{&&:#{E:@agent_live},#{==:#{@agent_state},wait}},1,}},#[fg=#{@thm_yellow}]▲ ,#{?#{P:#{?#{&&:#{E:@agent_live},#{==:#{@agent_state},working}},1,}},#[fg=#{@thm_cyan}]󰔟 ,#{?#{P:#{?#{&&:#{E:@agent_live},#{==:#{@agent_state},done}},1,}},#[fg=#{@thm_green}]✔ ,}}}"

setw -g window-status-format "#[fg=#{@thm_muted},bg=#{@thm_bar}] #I | #{E:@agent_icon}#[fg=#{@thm_muted}]#{E:@window_label} "
setw -g window-status-current-format "#[fg=#{@thm_blue},bg=#{@thm_bar_current},bold] #I | #{E:@agent_icon}#[fg=#{@thm_blue}]#{E:@window_label} "

set-option -gF pane-border-style "fg=#{@thm_faint}"
set-option -gF pane-active-border-style "fg=#{@thm_blue}"
# popups (prefix s, a, g, K) framed in the active pane border colour
set-option -gF popup-style "fg=#{@thm_text},bg=#{@thm_bg}"
set-option -gF popup-border-style "fg=#{@thm_blue},bg=#{@thm_bg}"
# selection in choose-tree (C-f s / w) and copy mode
set-option -gF mode-style "fg=#{@thm_on_accent},bg=#{@thm_cyan},bold"
# fill: since tmux 3.8 the prompt and messages are drawn over the status line, fill clears it
set-option -gF message-style "fg=#{@thm_blue},bg=#{@thm_bar_current},fill=#{@thm_bar_current}"
set-option -gF message-command-style "fg=#{@thm_blue},bg=#{@thm_bar_current},fill=#{@thm_bar_current}"
set-option -gF pane-scrollbars-style "fg=#{@thm_faint},bg=#{@thm_bg},width=1,pad=0"
