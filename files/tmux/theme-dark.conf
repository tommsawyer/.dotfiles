# gruvbox-material (hard) dark palette for tmux.conf, which sources it while `theme dark`
# (~/.config/theme): its formats take the colours as #{@thm_*}, by role, as nvim paints them.
# In lower case: styles are expanded as formats when drawn, and there #F (#D8A657) is the
# window flags, #D (#D3869B) the pane id
set -g @thm_bar "#141617"         # bg_dim: the status line
set -g @thm_bar_current "#282828" # bg1: the current tab, messages
set -g @thm_bg "#1d2021"          # bg0: popups, the scrollbar track
set -g @thm_on_accent "#1d2021"   # bg0: text on cyan / yellow (session name, selection)
set -g @thm_text "#d4be98"        # fg0
set -g @thm_muted "#928374"       # grey1: other tabs, the git branch
set -g @thm_faint "#7c6f64"       # grey0: borders, separators
set -g @thm_blue "#7daea3"
set -g @thm_cyan "#89b482"        # the theme's aqua
set -g @thm_yellow "#d8a657"
set -g @thm_purple "#d3869b"
set -g @thm_green "#a9b665"
set -g @thm_red "#ea6962"
