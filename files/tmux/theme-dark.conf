# OneDark (warmer) palette for tmux.conf, which sources it while `theme dark` (~/.config/theme):
# its formats take the colours as #{@thm_*}, by role. In lower case: styles are expanded as formats
# when drawn, and there #F (#FAFAFA) is the window flags, #D (#DBB671) the pane id
set -g @thm_bar "#1b1c1e"         # bg_d: the status line
set -g @thm_bar_current "#2c2d31" # bg1: the current tab, messages
set -g @thm_bg "#232326"          # bg0: popups, the scrollbar track
set -g @thm_on_accent "#1b1c1e"   # text on cyan / yellow (session name, selection)
set -g @thm_text "#a7aab0"        # fg
set -g @thm_muted "#818387"       # light_grey: other tabs, the git branch
set -g @thm_faint "#5a5b5e"       # grey: borders, separators
set -g @thm_blue "#57a5e5"
set -g @thm_cyan "#51a8b3"
set -g @thm_yellow "#dbb671"
set -g @thm_purple "#bb70d2"
set -g @thm_green "#8fb573"
set -g @thm_red "#e16d77"         # the warm style's, softer than warmer's
