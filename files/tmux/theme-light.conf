# gruvbox-material (hard) light palette for tmux.conf, which sources it while `theme light`
# (~/.config/theme); the same roles as theme-dark.conf, as nvim paints them: the bar on bg_dim,
# the current tab on the editor background, not darker as in the dark theme
set -g @thm_bar "#f3eac7"         # bg_dim
set -g @thm_bar_current "#f9f5d7" # bg0
set -g @thm_bg "#f9f5d7"          # bg0
set -g @thm_on_accent "#f9f5d7"   # bg0
set -g @thm_text "#654735"        # fg0
set -g @thm_muted "#928374"       # grey1
set -g @thm_faint "#a89984"       # grey0
set -g @thm_blue "#45707a"
set -g @thm_cyan "#4c7a5d"        # the theme's aqua
set -g @thm_yellow "#b47109"
set -g @thm_purple "#945e80"
set -g @thm_green "#6c782e"
set -g @thm_red "#c14a4a"
