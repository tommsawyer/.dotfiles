# OneDark (light) palette for tmux.conf, which sources it while `theme light` (~/.config/theme);
# the same roles as theme-dark.conf. The bar is bg1, not bg_d: on its #C9C9C9 grey text fades
set -g @thm_bar "#F0F0F0"         # bg1
set -g @thm_bar_current "#DCDCDC" # bg3
set -g @thm_bg "#FAFAFA"          # bg0
set -g @thm_on_accent "#FAFAFA"   # bg0
set -g @thm_text "#383A42"        # fg
set -g @thm_muted "#818387"       # light_grey
set -g @thm_faint "#A0A1A7"       # grey
set -g @thm_blue "#4078F2"
set -g @thm_cyan "#0184BC"
set -g @thm_yellow "#986801"
set -g @thm_purple "#A626A4"
set -g @thm_green "#50A14F"
set -g @thm_red "#E45649"
